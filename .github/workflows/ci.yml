name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-action:
    name: Test Action (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [single, multi]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create fixture chart
        run: |
          mkdir -p fixtures/charts/test-chart/templates
          cat > fixtures/charts/test-chart/Chart.yaml <<'YAML'
          apiVersion: v2
          name: test-chart
          version: 0.1.0
          appVersion: "1.0.0"
          description: CI fixture chart
          type: application
          YAML
          cat > fixtures/charts/test-chart/templates/configmap.yaml <<'YAML'
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: test-chart
          data:
            hello: world
          YAML

      - name: Run action — single mode
        if: matrix.mode == 'single'
        id: single
        uses: ./
        with:
          mode: single
          chart_path: fixtures/charts/test-chart
          enable_gh_pages: false
          enable_oci_push: true
          dry_run: true
          registry_login: false
          update_appversion: false

      - name: Run action — multi mode
        if: matrix.mode == 'multi'
        id: multi
        uses: ./
        with:
          mode: multi
          charts_dir: fixtures/charts
          enable_gh_pages: false
          enable_oci_push: true
          dry_run: true
          registry_login: false

      - name: Verify outputs
        run: |
          PUSHED="${{ steps.single.outputs.pushed_charts }}${{ steps.multi.outputs.pushed_charts }}"
          SKIPPED="${{ steps.single.outputs.skipped_charts }}${{ steps.multi.outputs.skipped_charts }}"
          echo "Mode: ${{ matrix.mode }}"
          echo "pushed_charts: $PUSHED"
          echo "skipped_charts: $SKIPPED"
          if [ -n "$PUSHED" ]; then
            echo "::error::dry_run was true but pushed_charts is non-empty"
            exit 1
          fi
          if ! echo "$SKIPPED" | grep -q 'test-chart:0.1.0'; then
            echo "::error::expected 'test-chart:0.1.0' in skipped_charts (dry-run), got: $SKIPPED"
            exit 1
          fi
          echo "[PASS] ${{ matrix.mode }} mode"

  test-gh-pages:
    name: Test gh-pages keeps published charts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Seed a local gh-pages branch with test-chart 0.1.0
        run: |
          set -euo pipefail
          git config user.name ci
          git config user.email ci@example.com
          write_chart() {
            mkdir -p "$1/templates"
            printf 'apiVersion: v2\nname: test-chart\nversion: %s\nappVersion: "1.0.0"\ndescription: CI fixture chart\ntype: application\n' "$2" > "$1/Chart.yaml"
            printf 'apiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: test-chart\ndata:\n  hello: world\n' > "$1/templates/configmap.yaml"
          }
          write_chart /tmp/seed-chart 0.1.0
          mkdir -p /tmp/seed
          helm package /tmp/seed-chart -d /tmp/seed
          helm repo index /tmp/seed --url https://example.com/helm-repo
          src=$(git rev-parse HEAD)
          git checkout -q --orphan gh-pages
          git rm -rfq .
          mkdir helm-repo && cp /tmp/seed/* helm-repo/
          git add helm-repo && git commit -qm "seed 0.1.0"
          git checkout -q "$src"
          write_chart fixtures/charts/test-chart 0.2.0

      - name: Run action — gh-pages dry run
        uses: ./
        with:
          mode: single
          chart_path: fixtures/charts/test-chart
          enable_gh_pages: true
          gh_pages_url: https://example.com/helm-repo
          enable_oci_push: false
          dry_run: true
          update_appversion: false

      - name: Verify both versions are on gh-pages
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = gh-pages
          for v in 0.1.0 0.2.0; do
            test -f "helm-repo/test-chart-$v.tgz" || { echo "::error::test-chart-$v.tgz missing from gh-pages"; exit 1; }
            grep -q "test-chart-$v.tgz" helm-repo/index.yaml || { echo "::error::index.yaml lacks $v"; exit 1; }
          done
          if git diff --cached --name-status | grep '^D'; then
            echo "::error::the action staged deletions on gh-pages"; exit 1
          fi
          echo "[PASS] gh-pages keeps 0.1.0 and adds 0.2.0"

  ci-result:
    name: CI Result
    if: always()
    needs: [test-action, test-gh-pages]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.test-action.result }}" != "success" || "${{ needs.test-gh-pages.result }}" != "success" ]]; then
            echo "::error::CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed"
